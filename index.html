<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1d24" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="DeuLern Grammatik mit System — a browser-based German grammar course for levels A1 to B1."
    />
    <title>DeuLern Grammatik mit System</title>
    <script>
      // Applies the saved theme before the first paint, so an explicit choice
      // never flashes the other theme. The key and shape must stay in step with
      // SETTINGS_STORAGE_KEY and persistedSettingsV1Schema in src/.
      try {
        var theme = JSON.parse(
          localStorage.getItem('grammatik-mit-system:settings') || '{}',
        ).theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Unreadable storage: fall back to the system theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
